# S5
[extruder]
step_pin: PG9
dir_pin: !PG10
enable_pin: !PG13
microsteps: 16
rotation_distance: 27.5504
Gear_ratio: 50:8
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PF6 # HE0
#sensor_pin: PA7
#sensor_type: PT1000
#pullup_resistor: 430
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 25000000000000
sensor_type:MAX31865
sensor_pin: PC9
spi_bus: spi3a
#spi_speed: 4000000
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2


#S5
[tmc5160 extruder]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: false
run_current: 1.0
sense_resistor: 0.110


# S6
[stepper_z]
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
microsteps: 32
rotation_distance: 4
endstop_pin: PC15
#position_endstop: -0.5
position_max: 300
position_min: -1
full_steps_per_rotation: 200
homing_retract_dist: 5.0
homing_positive_dir: false
homing_speed: 5.0
second_homing_speed: 2.5

#S6
[tmc5160 stepper_z]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.2
stealthchop_threshold: 0



[heater_bed]
heater_pin: PF5
sensor_pin: PB0 # TB
sensor_type: Generic 3950
control: pid
min_temp: 0
max_temp: 15000000000000
pid_kp: 45.150
pid_ki: 1.362
pid_kd: 374.177


[fan]
##	Print Cooling Fan - PF8
pin: PE7
max_power: 1
cycle_time: 0.002
hardware_pwm: false
shutdown_speed: 0

[fan_generic Exhaust_fan]
##  exhaust fan - In FAN4
pin: PA0
max_power: 1
shutdown_speed: 0
kick_start_time: 0.1
off_below: 0.10





[heater_fan hotend_fan]
pin: PA5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0


