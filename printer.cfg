[temperature_fan mcu_host]
pin: PA1
max_power: 1.0
kick_start_time: 0
sensor_type: temperature_host
control: watermark
min_temp: 10
max_temp: 65
target_temp: 45

[multi_pin my_enable_pin]
pins: PA2,PA3


[heater_fan radiator]

pin: PA6
tachometer_pin: PC1
cycle_time:  0.00004
hardware_pwm: true
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_ppr: 2
tachometer_poll_interval: 0.0015


[heater_fan pump]
pin: PE8
tachometer_pin: PG0
cycle_time:  0.00004
hardware_pwm: false
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_ppr: 2
tachometer_poll_interval: 0.0015



[output_pin LED]
#In FAN8 position if 12 or 5V
#When 24V use a heater pin like Heat4 PF6
pin=multi_pin:my_enable_pin
pwm: false
value: 1
shutdown_value:1
### gcode command: SET_PIN PIN=LED value=0 to 1




[temperature_sensor coolant_in]
sensor_type: Generic 3950
sensor_pin: PB1
min_temp: 0
max_temp: 100
pullup_resistor: 47000


[temperature_sensor coolant_out]
sensor_type: Generic 3950
sensor_pin: PC5
min_temp: 0
max_temp: 100
pullup_resistor: 47000




[bed_screws]
screw1: 20,20
screw2: 20,290
screw3: 290,290
screw4: 290,20




[board_pins]
aliases:
    # FPC header, Aliases EXP1 & EXP2 for mini12864
    EXP1_1=PG5, EXP1_2=PG4,
    EXP1_3=PG3, EXP1_4=PG2,
    EXP1_5=PD15, EXP1_6=PD14,
    EXP1_7=PD13, EXP1_8=PD12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PG8, EXP2_4=PE11,
    EXP2_5=PG7, EXP2_6=PE14,
    EXP2_7=PG6, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

