[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_4D0022001151313230353039-if00

[mcu host]
serial: /tmp/klipper_host_mcu


[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100












